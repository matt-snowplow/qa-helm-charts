# Local Kubernetes development values - use with:
# helm install avalanche ./helm -f ./helm/values-local.yaml
#
# This file configures Avalanche for local Kubernetes (Docker Desktop, minikube, kind)
# with locally-built images (imagePullPolicy: Never)
#
# Build images first: make container-build-all

images:
  # Use locally-built images (don't pull from registry)
  pullPolicy: Never
  logLevel: info
  # Same registry prefix as DockerHub - images just aren't pushed
  registry: "snowplow"
